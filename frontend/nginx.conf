server {
    listen 80;
    root /usr/share/nginx/html;

    # Client-side routes (e.g. /dashboard) all serve index.html
    location / {
        try_files $uri /index.html;
    }

    # Built files have a content hash in their name, so they never change and can be cached for good.
    # A missing one is a 404, not index.html: HTML served as JavaScript would leave a blank page.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
