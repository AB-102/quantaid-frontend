# Weekly update PRs, one per ecosystem. dependabot-auto-merge.yml merges each once the required checks pass;
# production only gets them in the next release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
